<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--Tab Titel-->
    <title>Lab für Sozioinformatik: Transformation Lab</title>

    <link rel="icon" href="https://fav.farm/💬" />

    <link rel="apple-touch-icon" href="https://fav.farm/💬" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <meta
      name="description"
      content="Ein interaktives Dialogue Lab zum Üben von Gesprächsführung."
    />

    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body class="flex flex-col lg:flex-row h-[100dvh] bg-gray-50 overflow-hidden">
    <header
      class="lg:hidden flex items-center justify-between bg-white border-b p-4 z-[40] w-full"
    >
      <h1 class="text-lg font-bold text-slate-800">Transformation Lab</h1>
      <button
        id="mobile-menu-btn"
        class="p-2 text-slate-600 hover:bg-slate-100 rounded-lg"
      >
        <span class="text-2xl">☰</span>
      </button>
    </header>
    <aside
      id="sidebar"
      class="fixed inset-y-0 left-0 z-[60] w-64 bg-white border-r border-gray-200 p-6 shadow-xl flex flex-col h-full transform -translate-x-full transition-transform duration-300 ease-in-out lg:static lg:translate-x-0 lg:shadow-none lg:flex-shrink-0"
    >
      <div class="sidebar-section mb-6">
        <label
          id="scenario-label"
          class="scenario-selection-headline block font-semibold mb-2 text-slate-700 text-sm"
          >Wähle eine Übung:</label
        >
        <select
          id="exercises"
          class="scenario-selection-dropdown w-full border border-slate-300 rounded-lg p-2.5 bg-white text-sm shadow-sm outline-none focus:ring-2 focus:ring-blue-500"
        >
          <option value="" selected disabled>Wähle eine Übung...</option>
        </select>
      </div>

      <div class="sidebar-section mb-6 pt-6 border-t border-slate-100">
        <label class="block font-semibold mb-2 text-slate-700 text-sm"
          >Ausgabe (Hören)</label
        >
        <label
          class="flex items-center justify-between mb-3 cursor-pointer group"
        >
          <span class="text-xs text-slate-500">Auto-Vorlesen</span>
          <input
            id="auto-speak-toggle"
            type="checkbox"
            class="w-9 h-5 rounded-full bg-gray-200 appearance-none checked:bg-blue-600 transition cursor-pointer relative after:content-[''] after:absolute after:top-1 after:left-1 after:bg-white after:w-3 after:h-3 after:rounded-full checked:after:translate-x-4 after:transition"
          />
        </label>
                <button
          id="stop-speech-btn"
          class="w-full text-[10px] text-red-400 bg-red-50 border border-red-100 py-1.5 rounded hover:bg-red-100 transition"
        >
          Alle Sprachausgaben stoppen 🔇
        </button>
      </div>

      <div
        class="sidebar-actions mt-auto space-y-3 pt-6 border-t border-slate-100"
      >
        <button
          id="download-btn"
          disabled
          class="w-full bg-blue-600 text-white py-3 rounded-xl font-bold text-sm shadow-md opacity-50 cursor-not-allowed flex items-center justify-center gap-2 transition hover:bg-blue-700"
        >
          <span>📥</span> Protokoll herunterladen
        </button>
        <button
          id="reset-btn"
          disabled
          class="w-full border-2 border-red-50 text-red-500 py-3 rounded-xl font-bold text-sm opacity-50 cursor-not-allowed flex items-center justify-center gap-2 transition"
        >
          <span>🔄</span> Neustart
        </button>
      </div>
    </aside>

    <div
      id="sidebar-overlay"
      class="fixed inset-0 bg-black/50 z-[50] hidden lg:hidden"
    ></div>

    <!-- Main Content Wrapper: Organisiert den scrollbaren Bereich und den festen Footer -->
    <div class="flex-1 flex flex-col min-h-0">
      <main
        class="chat-main-container flex-1 flex flex-col p-3 md:p-6 lg:p-10 overflow-y-auto"
      >
        <h1 class="main-title text-2xl md:text-3xl font-bold text-slate-800">
          Lab für Sozioinformatik: Transformation Lab
        </h1>
        <p
          id="main-subtitle"
          class="main-subtitle text-slate-500 mt-2 text-sm md:text-base"
        >
          Wähle eine Übung aus, um zu starten.
        </p>

        <div
          class="mt-4 max-w-3xl sticky top-0 z-[20] py-2 bg-gray-50/95 backdrop-blur-sm"
        >
          <div
            id="status-box"
            class="status-box bg-slate-50 text-slate-500 p-2 md:p-3 rounded-xl border border-slate-200 text-[10px] md:text-xs font-medium flex items-center gap-2 w-fit"
          >
            <span class="w-2 h-2 rounded-full bg-slate-300"></span>
            System bereit
          </div>
        </div>

        <section
          class="briefing-card mt-6 md:mt-8 bg-white border border-slate-200 rounded-2xl shadow-sm p-4 md:p-6 max-w-3xl"
        >
          <div
            class="briefing-click-area flex items-center justify-between cursor-pointer"
            id="briefing-header"
          >
            <div class="briefing-title-group flex items-center gap-2">
              <span class="briefing-icon text-xl md:text-2xl">📋</span>
              <h2
                class="briefing-headline text-lg md:text-xl font-semibold text-slate-800"
              >
                Deine Aufgabenstellung & Übungs-Details
              </h2>
            </div>
            <div class="flex items-center gap-2">
              <button
                id="speak-briefing-btn"
                class="hover:text-blue-600 transition-colors opacity-60 hover:opacity-100 p-0.5"
                title="Briefing vorlesen"
              >
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
                  <path fill-rule="evenodd" d="M9.383 3.076A1 1 0 0110 4v12a1 1 0 01-1.707.707L4.586 13H3a1 1 0 01-1-1V8a1 1 0 011-1h1.586l3.707-3.707a1 1 0 011.09-.217zM14.657 14.828a1 1 0 01-1.414-1.414 5 5 0 000-7.072 1 1 0 011.414-1.414 7 7 0 010 9.9z" clip-rule="evenodd" />
                </svg>
              </button>
              <span
                id="chevron"
                class="briefing-arrow text-slate-400 transition-transform"
                >▼</span
              >
            </div>
          </div>
          <div
            id="briefing-content"
            class="briefing-body mt-4 space-y-4 text-slate-600 leading-relaxed"
          ></div>
        </section>

        <div
          id="chat-window"
          class="chat-display flex flex-col flex-1 mt-8 space-y-6 bg-gray-50/50 scroll-smooth"
        >
          <div
            id="start-info"
            class="system-message flex justify-center my-6 w-100 hidden"
          >
            <div
              class="bg-blue-50 border border-blue-100 text-blue-700 px-6 py-3 rounded-2xl text-sm flex items-center gap-3 shadow-sm max-w-2xl"
            >
              <span class="text-lg">✨</span>
              <p>
                <strong>Bereit für das Gespräch.</strong> Eröffnen Sie den
                Dialog, indem Sie unten eine Nachricht eingeben.
              </p>
            </div>
          </div>
        </div>
      </main>

      <footer
        class="input-area pt-4 pb-6 md:pb-4 border-t border-slate-200 bg-white z-[30] flex-shrink-0"
      >
        <div
          id="exercise-actions"
          class="max-w-3xl mx-auto flex gap-2 px-4 w-full mb-3 hidden"
        >
          <button
            id="restart-exercise-btn"
            class="px-4 py-2 rounded-xl font-semibold text-sm border border-slate-300 text-slate-600 bg-white hover:bg-slate-50 transition"
          >
            Übung neu starten
          </button>
          <button
            id="revise-btn"
            class="px-4 py-2 rounded-xl font-semibold text-sm border border-blue-200 text-blue-700 bg-blue-50 hover:bg-blue-100 transition"
          >
            Überarbeiten
          </button>
          <button
            id="next-exercise-btn"
            class="px-4 py-2 rounded-xl font-semibold text-sm bg-blue-600 text-white hover:bg-blue-700 transition shadow-sm"
          >
            Nächste Aussage
          </button>
        </div>
        <div class="input-container max-w-3xl mx-auto flex gap-2 px-4 w-full">
          <input
            type="text"
            id="user-input"
            disabled
            class="user-text-input flex-1 p-3 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500 shadow-sm bg-gray-100 cursor-not-allowed text-base md:text-sm"
            placeholder="Wähle zuerst eine Übung aus..."
          />
          <button
            id="mic-btn"
            disabled
            class="p-3 text-gray-400 hover:text-blue-600 transition-colors opacity-50 cursor-not-allowed flex items-center justify-center"
            title="Spracheingabe"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="h-6 w-6"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-20a3 3 0 00-3 3v8a3 3 0 006 0V5a3 3 0 00-3-3z"
              />
            </svg>
          </button>
          <button
            id="send-btn"
            disabled
            class="send-button opacity-50 cursor-not-allowed bg-blue-600 text-white px-4 py-3 rounded-xl font-bold shadow-lg text-sm transition-all active:scale-95"
          >
            Senden
          </button>
        </div>
      </footer>
    </div>

    <script src="src/js/app.js" type="module"></script>
  </body>
</html>

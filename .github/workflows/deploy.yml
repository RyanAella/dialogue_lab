name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Build job: checks out, runs the JS syntax check, assembles the site
  # and uploads it as the 'github-pages' artifact.
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: JS Syntax Check
        run: |
          set -e
          find src/js -name '*.js' -exec node --check {} \;

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Build and copy files
        run: |
          mkdir -p public
          cp index.html public/
          cp -r src public/
          cp -r scenarios public/
          cp -r prompts public/
          touch public/.nojekyll

          # Edition subfolders: identical copies of index.html;
          # the SPA config derives the mode from the URL path
          mkdir -p public/simulation-lab
          mkdir -p public/practice-edition
          cp index.html public/simulation-lab/
          cp index.html public/practice-edition/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  # Deploy job: waits for the build job, so the artifact is fully
  # registered before deploy-pages looks it up (avoids the
  # "No artifacts named 'github-pages' were found" race condition).
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

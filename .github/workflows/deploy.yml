name: Multi-Branch Deployment to GitHub Pages

# Trigger the workflow on pushes to specific branches
on:
  push:
    # Correct syntax to trigger on ALL branches
    branches:
      - "**"
  # Allow manual triggering from the Actions tab
  workflow_dispatch:

# Required permissions to write to the gh-pages branch
permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Public Artifact Folder
        # Gather all static files and directories needed for the production build
        run: |
          mkdir -p public
          cp index.html public/
          cp -r src public/
          cp -r scenarios public/
          cp -r prompts public/
          touch public/.nojekyll

      - name: Determine Branch Subpath
        # Logic: deploy 'main' to root, other branches to subfolders named after the branch
        id: subpath
        run: |
          if [[ "${{ github.ref_name }}" == "main" ]]; then
            echo "SUB_PATH=." >> $GITHUB_OUTPUT
          else
            # Convert branch name to lowercase and replace special characters with hyphens
            CLEAN_NAME=$(echo "${{ github.ref_name }}" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g')
            echo "SUB_PATH=$CLEAN_NAME" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: public # The folder containing our artifacts
          target-folder: ${{ steps.subpath.outputs.SUB_PATH }} # Deployment destination path
          branch: gh-pages # The branch
          clean: false # Prevent deleting other branch deployments